name: Publish packages to the Maven Central Repository
on:
  workflow_dispatch:
  release:
    types: [created]
permissions:
  contents: read
  pull-requests: write
jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          generate-toolchains: false
          # ✅ 关键：自动生成settings.xml，注入server id=central
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Import GPG Key
        run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Publish to Maven Central
        run: |
          cp pom-hwkms.xml pom.xml
          mvn -B clean install -DskipTests -f pom.xml -Dgpg.passphrase="$GPG_PASSPHRASE"
          ls -la ~/.m2/repository/io/github/hwkms/huaweicloud-encryption-sdk-java/1.2.3/
          # 重点：-f /dev/null 脱离项目上下文，全限定插件目标
          mvn -B org.sonatype.central:central-publishing-maven-plugin:0.12.0:publish \
            -f /dev/null \
            -Dcentral.groupId=io.github.hwkms \
            -Dcentral.artifactId=huaweicloud-encryption-sdk-java \
            -Dcentral.version=1.2.3 \
            -Dcentral.stagingDirectory=${HOME}/.m2/repository/io/github/hwkms/huaweicloud-encryption-sdk-java/1.2.3 \
            -Dcentral.publishingServerId=central \
            -Dcentral.autoPublish=true
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_USERNAME: ${{ secrets.TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.TOKEN_PASSWORD }}

