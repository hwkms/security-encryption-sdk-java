name: Publish packages to the Maven Central Repository
on:
  workflow_dispatch:
  release:
    types: [created]
permissions:
  contents: read
  pull-requests: write
jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          generate-toolchains: false
          # ✅ 关键：自动生成settings.xml，注入server id=central
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Import GPG Key
        run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Publish to Maven Central
        run: mvn -B clean deploy -DskipTests -f pom-hwkms.xml -Dgpg.passphrase="$GPG_PASSPHRASE"
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          # 和上面 setup-java 里的占位符对应
          MAVEN_USERNAME: ${{ secrets.TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.TOKEN_PASSWORD }}
