[build-system]
requires = ["setuptools>=78.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huaweicloud-encryption-sdk-python"
version = "0.0.2"
description = "HuaweiCloud Encryption SDK for Python"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}

dependencies = [
    "cryptography>=42.0.0",
    "gmssl>=3.2.2",
    "huaweicloudsdkkms>=3.1.190",
    "huaweicloudsdkcore>=3.1.190",
    "requests>=2.31.0",
    "cachetools>=5.3.0",
]

[project.optional-dependencies]
lts = [
    "loguru",
    "six",
]
openssl-fallback = [
    "cryptography>=42.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["huaweicloud_encryptionsdk*"]

[tool.setuptools.package-data]
"huaweicloud_encryptionsdk" = ["_openssl/*.so", "_openssl/*.so.*"]
